name: "Approval"

on: 
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  pull-requests: write

jobs:
  check_approval:
    runs-on: ubuntu-latest
    steps:
    - uses: tspascoal/get-user-teams-membership@v3
      id: membership
      with:
        username: ${{ github.actor}}
        team: 'headmaintainers' # CHANGE THIS SHIT
        GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }} # CHANGE THIS SHIT
    - uses: actions-ecosystem/action-add-labels@v1
      if: steps.membership.outputs.isTeamMember == 'true'
      with:
        labels: "Status: Approved"
        
